name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'

      - name: Supply preservation tests (offline)
        run: node --test tests/*.test.mjs

      - name: Validate ADRs
        run: python3 scripts/adr-governance.py

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # v4 is required to read wrangler.jsonc; the action's default is older
          wranglerVersion: "4.127.0"

      - name: Smoke test (staging deploy)
        run: |
          sleep 5
          BASE="https://api.autonomi.workers.dev"
          total=$(curl -sf --max-time 20 "$BASE/api/total-supply")
          [ "$total" = "1200000000" ] || { echo "total-supply wrong: $total"; exit 1; }
          circ=$(curl -sf --max-time 30 "$BASE/api/circulating-supply")
          echo "$circ" | grep -qE '^[0-9]+$' || { echo "circulating-supply not a bare integer: $circ"; exit 1; }
          curl -sf --max-time 20 "$BASE/api/supply" | grep -q '"circulating_supply"' || { echo "supply JSON missing fields"; exit 1; }
          echo "staging OK: circulating=$circ"

      - name: Public contract test (api.autonomi.com)
        run: |
          BASE="https://api.autonomi.com"
          # Bare curl and an automation user-agent: catches zone bot
          # protection being switched back on, which would 403 machine
          # clients and CMC/CoinGecko would go quiet.
          # Retries for up to ~3 minutes: right after a custom-domain claim
          # the hostname can take a short while to answer from the Worker
          # (Cloudflare issues it a certificate).
          total=""
          for i in $(seq 1 12); do
            total=$(curl -sf --max-time 20 "$BASE/api/total-supply") && [ "$total" = "1200000000" ] && break
            echo "attempt $i: not ready yet (got '$total')"; sleep 15
          done
          [ "$total" = "1200000000" ] || { echo "bare curl blocked or total-supply wrong: $total"; exit 1; }
          circ=$(curl -sf --max-time 30 -A "Python-urllib/3.12" "$BASE/api/circulating-supply") || { echo "Python-urllib UA blocked"; exit 1; }
          echo "$circ" | grep -qE '^[0-9]+$' || { echo "circulating-supply not a bare integer: $circ"; exit 1; }
          # The Worker must be the origin: a cf-ray header proves Cloudflare
          # served it, so a DNS record quietly pointing elsewhere fails the build
          curl -s -o /dev/null -D - --max-time 20 "$BASE/api/total-supply" | grep -qi '^cf-ray:' || { echo "api.autonomi.com is not being served by the Worker"; exit 1; }
          echo "public contract OK: circulating=$circ"
