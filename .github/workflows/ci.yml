name: CI

on:
  push:
    branches: [feat/pricing-publication-v1]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'

      - name: Supply preservation tests (offline)
        run: node --test tests/*.test.mjs

      - name: Validate ADRs
        run: python3 scripts/adr-governance.py
